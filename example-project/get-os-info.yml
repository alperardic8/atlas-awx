---
- name: Collect Linux system information (stdout only)
  hosts: localhost
  connection: local
  gather_facts: yes

  tasks:

    - name: CPU bilgisi (lscpu)
      command: lscpu
      register: cpu_info
      changed_when: false

    - debug:
        msg: "{{ cpu_info.stdout }}"

    - name: Memory bilgisi (free -h)
      command: free -h
      register: mem_info
      changed_when: false

    - debug:
        msg: "{{ mem_info.stdout }}"

    - name: Disk bilgisi (df -h)
      command: df -h
      register: disk_info
      changed_when: false

    - debug:
        msg: "{{ disk_info.stdout }}"

    - name: OS release bilgisi (/etc/os-release)
      command: cat /etc/os-release
      register: os_info
      changed_when: false

    - debug:
        msg: "{{ os_info.stdout }}"

    - name: Network interface bilgisi (ip a)
      command: ip a
      register: net_info
      changed_when: false

    - debug:
        msg: "{{ net_info.stdout }}"

    - name: Routing tablosu (ip route)
      command: ip route
      register: route_info
      changed_when: false

    - debug:
        msg: "{{ route_info.stdout }}"

    - name: Yüklü paketler (debian tabanlı ise dpkg -l)
      command: dpkg -l
      register: pkg_deb
      changed_when: false
      failed_when: false

    - debug:
        msg: "{{ pkg_deb.stdout | default('dpkg yok (muhtemelen alpine/centos)') }}"

    - name: Yüklü paketler (rpm tabanlı ise rpm -qa)
      command: rpm -qa
      register: pkg_rpm
      changed_when: false
      failed_when: false

    - debug:
        msg: "{{ pkg_rpm.stdout | default('rpm yok (muhtemelen debian/alpine)') }}"

    - name: Process list (ps aux)
      command: ps aux
      register: ps_info
      changed_when: false

    - debug:
        msg: "{{ ps_info.stdout }}"
